career-profile:
    title: Career Profile
    summary: |
      I am a technically oriented Data Scientist with a mathematically intensive research master's degree and experience developing intelligent, software-intensive systems. At NN, I take technical ownership of AI/ML components throughout the development lifecycle: translating stakeholder needs into requirements, designing and implementing Python-based solutions, evaluating their behaviour, and coordinating integration with IT and business teams.

      Previously, I spent three years in Credit Risk Modelling at ABN AMRO, where I developed quantitative models and built a reusable Python-based machine learning codebase to accelerate and standardize model development. This experience combines mathematical modelling, probabilistic reasoning, modular software design and collaboration with multidisciplinary stakeholders.

      My research training provides a strong foundation in stochastic processes, state-space estimation, statistical inference and optimization. I am motivated by engineering problems that bring together algorithms, software architecture and real-world system integration, and would like to apply these skills to collaborative autonomous systems at TNO while developing expertise in robotics and formal systems engineering.

