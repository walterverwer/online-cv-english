career-profile:
    title: Career Profile
    summary: |
      I am a technically oriented Data Scientist with a research master's degree in econometrics and experience leading the development of intelligent, software-intensive systems. At NN, I take ownership of the technical solution lifecycle: understanding stakeholder needs, translating them into requirements, designing and implementing software, evaluating system behaviour, and collaborating with IT and business teams on integration and deployment. I work in an Agile/Scrum environment and combine hands-on Python development with cross-functional technical coordination.

      Previously, I spent three years in Credit Risk Modelling at ABN AMRO, implementing complex quantitative methodologies in reusable Python software, introducing automated unit testing and working with model validation, IT and business stakeholders. I also mentored junior colleagues and communicated technical decisions in a highly regulated environment.

      My research master at Tinbergen Institute provided rigorous, research-oriented training in mathematical modelling, statistics and econometrics. I am motivated by multidisciplinary engineering challenges that combine mathematical reasoning, software development and practical system integration. I am keen to bring these capabilities to the development of collaborative autonomous systems at TNO, while expanding my expertise in formal systems engineering and robotics.

