career-profile:
    title: Career Profile
    summary: |
     I am a Data Scientist with three years of experience in Credit Risk Modelling at ABN AMRO, 
     where I developed PD and LGD models end-to-end in a highly regulated financial environment. 
     I enjoy building practical AI/ML solutions that add direct value for the business, and I work 
     well in dynamic environments where innovation is encouraged. I hold a research master from 
     the Tinbergen Institute with PhD-level coursework in econometrics and finance.

education:
    title: Education
    info:
      - degree: MPhil Economics, Econometrics and Finance
        university: Tinbergen Institute
        time: Sep 2020 - Aug 2022
        details: |
          Tinbergen Institute (TI) is the graduate school and research institute operated jointly by the Schools of Economics and Econometrics
          of Erasmus University Rotterdam (EUR), University of Amsterdam (UvA) and Vrije Universiteit Amsterdam (VU). TI offers a selective research
          master program connected to PhD opportunities. I specialized in finance and econometrics.

      - degree: BSc in Economics and Business Economics (cum laude)
        university: Vrije Universiteit Amsterdam
        time: Sep 2017 - Aug 2020
        details: |
          Specialized in finance and econometrics. Completed minor in econometrics and worked one year as a University Research Fellow
          researching the impact of Covid-19 on financial markets using advanced time-series models.

experiences:
  title: Experiences
  info:
    - role: Data Scientist - Credit Risk Modelling
      time: Feb 2023 - Present
      company: ABN AMRO Bank N.V.
      details: |
        - Developed PD and LGD models end-to-end (data sourcing, data quality checks, feature engineering, model development, validation, documentation).
        - Contributed to building a unified modelling codebase for PD and LGD, including automated unit testing and structured workflows.
        - Set up automated unit testing using Azure DevOps pipelines.
        - Worked in a highly regulated environment with strict requirements for explainability, validation and reproducibility.
        - Represented model components during stakeholder meetings and regulatory interactions.
        - Mentored junior team members in modelling workflows and Python best practices.
        - Collaborated with cross-functional teams (IT, Validation, Business) to deliver models into production.

    - role: Economics Teacher
      time: Oct 2022 - Jan 2023
      company: Andreas College
      details: |
        - Taught economics to high school students (ages 13–17), improving communication and explanation skills.

    - role: Graduate Teaching Assistant
      time: Aug 2021 - Apr 2022
      company: Tinbergen Institute
      details: |
        - Taught Python programming and Corporate Finance at graduate level.

    - role: University Research Fellow
      time: Aug 2019 - Sep 2020
      company: Vrije Universiteit Amsterdam
      details: |
        - Conducted empirical research using VAR and VECM time-series models.
        - Awarded €10,000 research grant.
        - Worked primarily in Python.

    - role: Student Representative
      time: Sep 2017 - Aug 2020
      company: Vrije Universiteit Amsterdam
      details: |
        - Provided study information sessions to groups of 50–300 students.

    - role: Programme Committee Member
      time: Sep 2017 - Aug 2020
      company: Vrije Universiteit Amsterdam
      details: |
        - Advised programme management on curriculum improvements.

