career-profile:
    title: Career Profile
    summary: |
      I am a technically oriented Data Scientist with a mathematically intensive research master's degree and experience leading the development of intelligent, software-intensive systems. At NN Group, I work across the solution lifecycle: translating stakeholder needs into requirements, designing and implementing Python-based solutions, evaluating system behaviour, and coordinating integration with IT and business teams in an Agile/Scrum environment.

      Previously, I spent three years in Credit Risk Modelling at ABN AMRO, translating quantitative methodologies into reusable software, introducing automated testing, and collaborating with IT, model validation and business stakeholders. My experience combines software engineering, mathematical modelling, uncertainty quantification and the use of probabilistic model outcomes to support practical decisions.

      My MPhil at Tinbergen Institute provided a strong foundation in applied mathematics, statistics and econometrics. I am particularly interested in multidisciplinary engineering problems involving algorithms, decision-making under uncertainty and reliable system integration. I would like to apply these skills to collaborative autonomous systems at TNO while developing deeper expertise in robotics and formal systems engineering.

education:
