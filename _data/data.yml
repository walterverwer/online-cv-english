experiences:
    title: Experience
    info:
      - role: Data Scientist - AI/ML Applications
        time: Feb 2026 - Present
        company: NN
        details: |
          - Take technical ownership of the AI/ML workstream within projects, from stakeholder needs and feasibility assessment through requirements, solution design, Python implementation and evaluation.
          - Translate business needs into functional requirements, measurable success criteria and technical constraints in collaboration with business owners and IT.
          - Design modular software components, interfaces and data flows, including Python-based solutions that integrate with other applications through APIs.
          - Coordinate technical dependencies, integration readiness and implementation activities with IT and operational teams; work within Agile/Scrum processes.
          - Evaluate model and system behaviour, reliability and edge cases, and document assumptions, design decisions and outcomes.
          - Work on pension pricing and AI-driven process automation, including classification, document-information extraction and LLM-based multi-agent workflows.

      - role: Data Scientist - Credit Risk Modelling
        time: Feb 2023 - Feb 2026
        company: ABN AMRO Bank N.V.
        details: |
          - Developed quantitative credit risk rating systems in Python, including statistical estimation, calibration and analysis of model assumptions.
          - Designed and built a reusable Python-based machine learning codebase to accelerate model development and standardize workflows across risk modelling projects.
          - Structured mathematical methods as modular software components, improving reusability, consistency and maintainability.
          - Collaborated with IT, Model Validation and Risk teams on requirements, model verification, technical dependencies and documentation; used Azure DevOps pipelines for automated unit tests.
          - Explained model methodologies and outcomes to technical and non-technical stakeholders, including in regulatory discussions, and mentored junior colleagues in modelling and Python development.

      - role: Economics Teacher
        time: Oct 2022 - Jan 2023
        company: Andreas College
        details: |
          - Full time professional teacher in economics at a Dutch high school.
          - Strengthened my ability to explain abstract concepts clearly and communicate effectively with groups.

      - role: Graduate Researcher
        time: Aug 2021 - Apr 2022
        company: Tinbergen Institute
        details: |
          - Developed novel mathematical models by applying option-pricing theory and stochastic calculus to optimal corporate investment decisions.
          - Translated theoretical questions into quantitative models, evaluated assumptions and communicated research outcomes.

      - role: University Research Fellow
        time: Aug 2019 - Sep 2020
        company: Vrije Universiteit Amsterdam
        details: |
          - Conducted quantitative research on the impact of Covid-19 on financial markets, implementing VAR and VECM time-series analyses in Python.
          - Awarded a EUR 10,000 research grant.

