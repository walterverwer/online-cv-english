        time: Sep 2017 - Aug 2020
        details: |
          Specialized in econometrics. Conducted quantitative research alongside the programme as a University Research Fellow.

experiences:
  title: Experience
  info:
    - role: Data Scientist - AI/ML Applications
      time: Feb 2026 - Present
      company: NN Group
      details: |
        - Lead the technical development of intelligent, software-intensive AI/ML solutions for Life & Pensions, from stakeholder needs and feasibility assessment through solution design, implementation, evaluation and coordination with IT on production integration.
        - Translate stakeholder needs into functional requirements, measurable success criteria, technical designs and implementation constraints, in collaboration with business owners and IT.
        - Break down business processes into software components, interfaces and data flows; design reusable Python-based solutions, including functionality exposed through APIs.
        - Evaluate model and system behaviour, including uncertainty, reliability and edge cases; document technical decisions, assumptions and test results.
        - Coordinate technical dependencies, integration readiness and operational considerations with IT and business teams, working within Agile/Scrum processes.
        - Work on pension pricing models and AI-enabled process automation, including classification models, document-information extraction and multi-agent AI workflows.

    - role: Data Scientist - Credit Risk Modelling
      time: Feb 2023 - Feb 2026
      company: ABN AMRO Bank N.V.
      details: |
        - Developed quantitative PD, LGD and EAD models and Python implementations, translating mathematical methodologies and regulatory requirements into reusable model components and calculations.
        - Applied statistical modelling and uncertainty quantification to estimate financial risks and support decisions based on probabilistic outcomes.
        - Contributed to a modular modelling codebase with reusable software components and reproducible end-to-end workflows.
        - Implemented automated unit tests in Azure DevOps CI/CD pipelines to detect regressions and improve software reliability during model development.
        - Worked with IT, Model Validation, Risk and business stakeholders on technical requirements, model verification, dependencies and documentation.
        - Presented technical assumptions and outcomes in stakeholder and regulatory discussions, and mentored junior colleagues in Python, modelling and code quality.

    - role: Economics Teacher
      time: Oct 2022 - Jan 2023
      company: Andreas College
      details: |
        - Designed and delivered structured lessons, explaining complex concepts clearly to different audiences.

    - role: Graduate Researcher
      time: Aug 2021 - Apr 2022
      company: Tinbergen Institute
      details: |
        - Developed mathematical models applying option-pricing theory to optimal corporate investment decisions.
        - Translated theoretical questions into quantitative models, evaluated assumptions and communicated research outcomes.

    - role: University Research Fellow
      time: Aug 2019 - Sep 2020
      company: Vrije Universiteit Amsterdam
      details: |
        - Conducted quantitative research on the impact of Covid-19 on financial markets, implementing VAR and VECM time-series analyses in Python.
        - Awarded a EUR 10,000 research grant.

