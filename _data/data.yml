experiences:
  title: Experience
  info:
    - role: Data Scientist - AI/ML Applications
      time: Feb 2026 - Present
      company: NN Group
      details: |
        - Lead the technical development of software-intensive AI/ML solutions for Life & Pensions, from initial business need and feasibility assessment through solution design, implementation and evaluation; collaborate with IT on integration and deployment activities.
        - Elicit stakeholder needs and translate them into functional requirements, measurable success criteria, technical designs and implementation constraints, together with business owners and IT.
        - Decompose business processes into software components, interfaces and data flows; design and implement modular, reusable Python-based solutions with attention to reliability, maintainability and explainability.
        - Work with IT and operational stakeholders on technical dependencies, integration, deployment readiness and alignment with existing enterprise systems; production releases are carried out in collaboration with delivery teams.
        - Evaluate solution behaviour, document design choices and test outcomes, and iterate on solutions within Agile/Scrum workflows.
        - Work on pension pricing models and AI-based business-process automation, including translation, document-information extraction and multi-agent AI workflows.

    - role: Data Scientist - Credit Risk Modelling
      time: Feb 2023 - Feb 2026
      company: ABN AMRO Bank N.V.
      details: |
        - Developed quantitative PD, LGD and EAD models and their Python implementations, translating mathematical methodologies and regulatory requirements into reproducible model components and calculations.
        - Contributed to the design of a modular modelling codebase, with reusable software components and structured end-to-end workflows.
        - Implemented automated unit testing in Azure DevOps CI/CD pipelines to improve software reliability and detect regressions during model development.
        - Worked with IT, Model Validation, Risk and business stakeholders to clarify technical requirements, resolve dependencies, support model verification and document decisions and limitations.
        - Presented technical methods, assumptions and model outcomes in stakeholder and regulatory discussions.
        - Mentored junior colleagues in quantitative modelling, Python development, testing practices and code quality.

    - role: Economics Teacher
      time: Oct 2022 - Jan 2023
      company: Andreas College
      details: |
        - Designed and delivered structured lessons, explaining complex concepts clearly and adapting technical communication to different audiences.

    - role: Graduate Researcher
      time: Aug 2021 - Apr 2022
      company: Tinbergen Institute
      details: |
        - Developed mathematical models applying option-pricing theory to optimal corporate investment decisions.
        - Translated theoretical questions into quantitative models, evaluated assumptions and communicated research outcomes.

    - role: University Research Fellow
      time: Aug 2019 - Sep 2020
      company: Vrije Universiteit Amsterdam
      details: |
        - Conducted quantitative research on the impact of Covid-19 on financial markets, implementing VAR and VECM time-series analyses in Python.
        - Awarded a EUR 10,000 research grant.


