    info:
      - degree: MPhil Economics, Econometrics and Finance (cum laude)
        university: Tinbergen Institute
        time: Sep 2020 - Aug 2022
        details: |
          Specialization in econometrics and finance. The programme is a selective, mathematically intensive two-year research master's programme with PhD-oriented coursework, jointly offered by Erasmus University Rotterdam, the University of Amsterdam and Vrije Universiteit Amsterdam.
          Strong foundation in applied mathematics, probability, statistics and econometrics, with an emphasis on stochastic modelling, quantitative methods and rigorous analysis of complex problems.
          Fully funded through a monthly scholarship and full tuition waiver.

